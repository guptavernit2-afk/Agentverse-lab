[project]
name = "agentverse-lab"
version = "0.1.0"
description = "AgentVerse local simulation lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.1"

[tool.uv.build-backend]
module-name = "agentverse"

[tool.pytest.ini_options]
testpaths = ["tests"]
